[package]
name = "loan-amortization-risks"
version = "0.2.1"
edition = "2021"
description = "Home loan amortization calculator with risk analysis for Florida home buyers"

[[bin]]
name = "loan-calc"
path = "src/main.rs"

[[bin]]
name = "loan-calc-gui"
path = "src/gui.rs"
required-features = ["gui"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
itertools = "0.14"
plotters = "0.3"

# Optional GUI dependencies
eframe = { version = "0.29", optional = true }
egui_extras = { version = "0.29", optional = true, features = ["all_loaders"] }
image = { version = "0.25", optional = true, features = ["png"] }
rfd = { version = "0.15", optional = true }

[features]
default = []
gui = ["eframe", "egui_extras", "image", "rfd"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
