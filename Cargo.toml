[package]
name = "loan-amortization-risks"
version = "0.1.0"
edition = "2021"
description = "Home loan amortization calculator with risk analysis for Florida home buyers"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
itertools = "0.14"
plotters = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
